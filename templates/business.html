{% extends "base.html" %}
{% block title %}业务合作{% endblock %}
{% block header %}业务合作{% endblock %}
{% block content %}
<div class="card">
    <div class="content">
        <h2 style="color: #6469ab; margin-bottom: 20px;">业务合作</h2>
        <h3 style="color: #333; margin: 20px 0 10px;">合作范围</h3>
        <p>包括信息系统工程咨询和监理业务等。</p>
        <h3 style="color: #333; margin: 20px 0 10px;">合作方式</h3>
        <ul style="margin-left: 2em; line-height: 1.8; margin-bottom: 15px;">
            <li>资金投资</li>
            <li>区域业务拓展</li>
            <li>细分行业业务拓展</li>
            <li>重点项目攻坚</li>
            <li>业务资源共享</li>
            <li>项目托管</li>
            <li>单个项目合作</li>
            <li>同行合作</li>
            <li>其他创新合作</li>
        </ul>
        <div class="quote-box">
            <p class="q">"万人操弓，共射一招，招无不中。"</p>
            <p class="a">——《吕氏春秋》</p>
        </div>
    </div>
</div>
{% endblock %}
