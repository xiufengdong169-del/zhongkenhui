{% extends "base.html" %}
{% block title %}技术合作{% endblock %}
{% block header %}技术合作{% endblock %}
{% block content %}
<div class="card">

        <h2 style="color: #6469ab; margin-bottom: 20px;">技术合作</h2>
        <h3 style="color: #333; margin: 20px 0 10px;">合作方式</h3>
        <ul style="margin-left: 2em; line-height: 1.8; margin-bottom: 15px;">
            <li>技术兼职</li>
            <li>技术资源共享</li>
            <li>技术外包</li>
