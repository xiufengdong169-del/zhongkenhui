{% extends "base.html" %}
{% block title %}加入众肯{% endblock %}
{% block header %}加入众肯{% endblock %}
{% block content %}
{% if message %}
<div class="alert {{ 'alert-success' if success else 'alert-error' }}">{{ message }}</div>
{% endif %}

{% if not success %}
<div class="card">
    <form method="post" action="/register">
        <div class="form-group">
            <label>姓名 <span style="color: red;">*</span></label>
            <input type="text" name="name" placeholder="请输入您的姓名" required>
        </div>
        <div class="form-group">
            <label>手机号码 <span style="color: red;">*</span></label>
            <input type="tel" name="phone" placeholder="请输入您的手机号码" required maxlength="11">
        </div>
        <div class="form-group">
            <label>所在地区 <span style="color: red;">*</span></label>
            <select name="province" required>
                <option value="">请选择省份</option>
                {% for p in ["北京","天津","河北","山西","内蒙古","辽宁","吉林","黑龙江","上海","江苏","浙江","安徽","福建","江西","山东","河南","湖北","湖南","广东","广西","海南","重庆","四川","贵州","云南","西藏","陕西","甘肃","青海","宁夏","新疆","台湾","香港","澳门"] %}
                <option value="{{ p }}">{{ p }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>自我介绍</label>
            <textarea name="describe" placeholder="请简单介绍一下自己（选填）"></textarea>
        </div>
        <div class="tip">提示：请务必提交真实的客户信息，若多次提交虚假信息，您的帐号将会被暂停或终止。</div>
        <button type="submit" class="btn">提交注册</button>
    </form>
</div>
{% endif %}
{% endblock %}
