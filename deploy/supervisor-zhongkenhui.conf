[program:zhongkenhui]
directory=/opt/apps/zhongkenhui
command=/opt/apps/zhongkenhui/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8100 --workers 2
user=ubuntu
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/zhongkenhui/uvicorn.out.log
stderr_logfile=/var/log/zhongkenhui/uvicorn.err.log
environment=PYTHONUNBUFFERED="1"
