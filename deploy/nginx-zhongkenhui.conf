# 众肯会服务号 v2 - Nginx 站点（域名 zonken.com）
# 放置：/etc/nginx/sites-available/zhongkenhui.conf → 软链到 sites-enabled
# HTTPS 证书就绪后用 certbot --nginx -d zonken.com -d www.zonken.com 自动补 443

server {
    listen 80;
    server_name zonken.com www.zonken.com;

    access_log /var/log/nginx/zhongkenhui.access.log;
    error_log  /var/log/nginx/zhongkenhui.error.log;

    location /static/ {
        alias /opt/apps/zhongkenhui/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
